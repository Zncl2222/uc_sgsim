name: Unit tests and coverage

on:
  push:
    branches: ["main", "develop", "v2"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build_shared_library:
    name: build-shared-library (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Pull Submodule
        run: git submodule update --init --recursive
      - name: Build DLL
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\build_scripts\cmake_build.bat -s
      - name: Build shared library
        if: runner.os == 'Linux'
        run: sh ./build_scripts/cmake_build.sh -s
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-shared-library
          path: |
            ./uc_sgsim/c_core/uc_sgsim.dll
            ./uc_sgsim/c_core/uc_sgsim.so
          if-no-files-found: error

  python_test:
    name: py-unittest (${{ matrix.python-version }}, ${{ matrix.os }})
    needs: build_shared_library
    strategy:
      max-parallel: 5
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-22.04
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Download shared library
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.os }}-shared-library
      - name: Install DLL
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item ./uc_sgsim.dll ./uc_sgsim/c_core/
      - name: Install shared library
        if: runner.os == 'Linux'
        run: mv ./uc_sgsim.so ./uc_sgsim/c_core/
      - name: Run tests and collect coverage
        run: pytest -n auto --cov --cov-report xml:py_coverage.xml
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        with:
          name: python-coverage
          path: ./py_coverage.xml
          if-no-files-found: error

  c_test:
    name: c-unittest
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pull Submodule
        run: git submodule update --init --recursive
      - name: Build native targets
        run: |
          cmake -S . -B build
          cmake --build build/ --config Release
      - name: Run tests
        run: |
          cd build
          ./c_example.out
          ./test/unittest
      - name: Install LCOV
        run: sudo apt-get --assume-yes install lcov > /dev/null
      - name: Collect coverage
        run: lcov -c -d build -o build/cover.info
      - uses: actions/upload-artifact@v4
        with:
          name: c-coverage
          path: ./build/cover.info
          if-no-files-found: error

  c_test_windows:
    name: c-unittest-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pull Submodule
        run: git submodule update --init --recursive
      - name: Build and test
        run: .\build_scripts\cmake_build.bat

  python_coverage:
    name: codecov-py
    runs-on: ubuntu-latest
    needs: python_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: python-coverage
      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@v4.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: py_coverage.xml

  c_coverage:
    name: codecov-c
    runs-on: ubuntu-latest
    needs: c_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: c-coverage
      - name: Upload C coverage to Codecov
        uses: codecov/codecov-action@v4.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: cover.info
