[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "uc_sgsim"
version = "1.3.0"
description = "Random Field Generation"
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [{ name = "Zncl2222", email = "3002shinning@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["matplotlib", "numpy", "scipy"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/Zncl2222/Stochastic_UC_SGSIM"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.15"
build-dir = "build/{wheel_tag}"
# The native engine is loaded with ctypes, not imported as a CPython extension,
# so one wheel per platform serves every Python version.
wheel.py-api = "py3"
wheel.packages = ["uc_sgsim"]
wheel.exclude = ["**/*.c", "**/*.h", "**/*.sh", "**/*.bat", "**/CMakeLists.txt"]
sdist.include = ["uc_sgsim/c_core/**", "c_example.c", "CMakeLists.txt", "uc_sgsim/CMakeLists.txt"]
sdist.exclude = ["figure", ".github", "benchmarks"]

[tool.scikit-build.cmake.define]
IS_EXECUTE = "OFF"
